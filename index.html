<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼이 들어올 자리 */
    #userArea { margin: 10px 0; color: #666; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 200px; font-size: 15px; }
    .memo button { float: right; }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>

  <!-- Firestore에 저장됩니다 -->
  <p class="notice" style="background:#e9ffe9;">✅ 메모가 Firestore에 자동 저장됩니다.</p>

  <!-- 로그인 영역: 구글 로그인/로그아웃 버튼과 사용자 이름 -->
  <div id="userArea">
    <button id="loginBtn">🔑 구글로 로그인</button>
    <span id="userInfo" style="display:none;">
      <span id="userName"></span>
      <small id="userUid" style="color:#999;"></small>
      <button id="logoutBtn">로그아웃</button>
    </span>
  </div>

  <div id="writer" hidden>
    <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터"></textarea>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
